<!DOCTYPE html>
<html lang="en">

<head>
    <script src="hide-console.js"></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Monkeyz - Sign Up</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #886bd0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }

        .container {
            border: 1px solid #c33;
            padding: 30px;
            width: 380px; /* Slightly narrower card container */
            text-align: center;
            box-shadow: 0 0 20px rgba(0, 0, 0, 0.25);
            border-radius: 10px;
            background: white;
            box-sizing: border-box;
        }

        img.logo {
            width: 100px;
            margin-bottom: 25px;
        }

        h2 {
            color: #a00;
            font-size: 28px;
            margin-bottom: 25px;
        }

        input {
            width: 85%; /* Reduced breadth (width) */
            padding: 10px 12px; /* Reduced length (height/padding) */
            margin: 10px 0;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 15px; /* Slightly smaller text */
            box-sizing: border-box;
            display: block;
            margin-left: auto;
            margin-right: auto;
        }

        input:focus {
            outline: none;
            border-color: #a00;
        }

        button {
            background-color: #a00;
            border: none;
            color: white;
            padding: 12px;
            margin-top: 15px;
            border-radius: 6px;
            font-size: 18px;
            cursor: pointer;
            width: 85%; /* Matches the input box width */
        }

        button:hover {
            background-color: #700;
        }

        button:disabled {
            background-color: #888;
            cursor: not-allowed;
        }

        #message {
            margin-top: 15px;
            font-size: 14px;
            min-height: 20px;
        }

        .success {
            color: green;
        }

        .error {
            color: red;
        }

        .login-link {
            margin-top: 15px;
            display: block;
            color: #a00;
            text-decoration: none;
            font-size: 14px;
        }

        .login-link:hover {
            text-decoration: underline;
        }
    </style>
</head>

<body>

    <div class="container">

        <img
            class="logo"
            src="maddy.jpeg"
            alt="Monkeyz Logo"
        >

        <h2>Sign Up</h2>

        <form id="signup-form">

            <input
                type="text"
                id="username"
                placeholder="Username"
                required
            >

            <input
                type="email"
                id="email"
                placeholder="Email"
                required
            >

            <input
                type="text"
                id="registerId"
                placeholder="Registration ID"
                required
            >

            <input
                type="password"
                id="password"
                placeholder="Password"
                required
            >

            <input
                type="password"
                id="confirmPassword"
                placeholder="Confirm Password"
                required
            >

            <button
                type="submit"
                id="registerButton"
            >
                Register
            </button>

        </form>

        <div id="message"></div>

        <a
            class="login-link"
            href="login.html"
        >
            Already have an account? Login
        </a>

    </div>

    <script src="main5.js"></script>

</body>

</html>
